name: Publish Service Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  packages: write

jobs:

  # --------------------------------------------------
  # Detect affected Nx applications
  # --------------------------------------------------
  detect:
    runs-on: ubuntu-latest

    outputs:
      apps: ${{ steps.affected.outputs.apps }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Detect affected deployable services
        id: affected
        shell: bash
        run: |
          APPS=$(bunx nx show projects \
            --affected \
            --type app \
            --json \
            | jq -c '[
                .[]
                | select(
                    . == "booking-service"
                    or . == "patient-service"
                    or . == "notification-service"
                    or . == "api-gateway"
                  )
              ]')

          echo "Affected applications: $APPS"
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"


  # --------------------------------------------------
  # Docker build + GHCR push
  # --------------------------------------------------
  build-images:
    needs:
      - detect

    if: needs.detect.outputs.apps != '[]'

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare registry values
        id: registry
        shell: bash
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.app }}

          tags: |
            type=raw,value=${{ steps.registry.outputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.nest

          push: true

          build-args: |
            APP_NAME=${{ matrix.app }}
            SOURCE_URL=https://github.com/${{ github.repository }}

          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

          cache-from: |
            type=gha,scope=${{ matrix.app }}

          cache-to: |
            type=gha,scope=${{ matrix.app }},mode=max