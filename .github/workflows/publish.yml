name: Publish

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  actions: read
  packages: write

jobs:

  # ==================================================
  # 1. Verify
  # ==================================================
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      # ==================================================
      # Will Enable this later when we have a proper linting setup for all projects
      # ==================================================

      # - name: Lint affected
      #   run: bunx nx affected -t lint

      - name: Test affected
        run: bunx nx affected -t test

      - name: Build affected
        run: bunx nx affected -t build

  # ==================================================
  # 2. Detect deployable affected applications
  # ==================================================
  detect:
    needs:
      - verify

    runs-on: ubuntu-latest

    outputs:
      apps: ${{ steps.affected.outputs.apps }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Detect affected services
        id: affected
        shell: bash
        run: |
          APPS=$(bunx nx show projects \
            --affected \
            --type app \
            --json \
            | jq -c '[
                .[]
                | select(
                    . == "booking-service"
                    or . == "patient-service"
                    or . == "notification-service"
                    or . == "api-gateway"
                  )
              ]')

          echo "Affected apps: $APPS"

          echo "apps=$APPS" >> "$GITHUB_OUTPUT"


  # ==================================================
  # 3. Docker build / GHCR push
  # ==================================================
  publish:
    needs:
      - verify
      - detect

    if: needs.detect.outputs.apps != '[]'

    strategy:
      fail-fast: false

      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image variables
        id: vars
        shell: bash
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6

        with:
          context: .
          file: docker/Dockerfile.nest

          push: true

          build-args: |
            APP_NAME=${{ matrix.app }}
            SOURCE_URL=https://github.com/${{ github.repository }}

          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.app }}:${{ steps.vars.outputs.tag }}

          cache-from: |
            type=gha,scope=${{ matrix.app }}

          cache-to: |
            type=gha,scope=${{ matrix.app }},mode=max


  # ==================================================
  # 4. Update GitOps dev environment
  # ==================================================
  update-gitops:
    needs:
      - detect
      - publish

    if: needs.detect.outputs.apps != '[]'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: whospiko/clinic-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: clinic-gitops
          persist-credentials: false

      - name: Update DEV image versions
        shell: bash
        env:
          APPS: ${{ needs.detect.outputs.apps }}
        run: |
          TAG="${GITHUB_SHA}"

          echo "$APPS" | jq -r '.[]' | while read APP
          do
            VALUES_FILE="clinic-gitops/environments/dev/${APP}/values.yaml"

            echo "Updating: ${VALUES_FILE}"
            echo "Image tag: ${TAG}"

            if [ ! -f "${VALUES_FILE}" ]; then
              echo "ERROR: file does not exist: ${VALUES_FILE}"
              exit 1
            fi

            sed -i -E \
              "s|^([[:space:]]*)tag:.*|\1tag: \"${TAG}\"|" \
              "${VALUES_FILE}"
          done

      - name: Commit GitOps change
        working-directory: clinic-gitops
        shell: bash
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git config user.name "clinic-ci"
          git config user.email "clinic-ci@users.noreply.github.com"

          if git diff --quiet; then
            echo "No GitOps changes detected."
            exit 0
          fi

          git add environments/dev

          git commit -m "deploy(dev): ${GITHUB_SHA}"

          git remote set-url origin "https://x-access-token:${GITOPS_TOKEN}@github.com/whospiko/clinic-gitops.git"

          git push origin HEAD:main